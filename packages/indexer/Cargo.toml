[package]
name = "indexer"
version = "2.5.4"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.12.0", features = ["full"] }
futures = "0.3"
dpp = { git = "https://github.com/dashpay/platform", tag = "v5.0.0-rc.8" }
data-contracts = { git = "https://github.com/dashpay/platform", tag = "v5.0.0-rc.8" }
dapi-grpc = { git = "https://github.com/dashpay/platform", tag = "v5.0.0-rc.8", default-features = false, features = ["platform", "client", "transport"] }
async-trait = { version = "0.1"}
anyhow = { version = "1.0"}
base64 = "0.21.2"
deadpool-postgres = "0.10.5"
refinery = { version = "0.8.10", features = ["tokio-postgres"] }
sha256 = "1.4.0"
dotenv = "0.15.0"
chrono = { version = "0.4.37", features = ["serde"] }
tokio-postgres = { version="0.7.10", features=["with-chrono-0_4", "with-serde_json-1"] }
time = { version="0.3.29", features=["serde"] }
dashcore-rpc = { git = "https://github.com/dashpay/rust-dashcore", rev = "d631aaca3632cc713143476e363c9a9aca038d2e" }
hex = "0.4.3"
bincode_derive = "=2.0.1"
